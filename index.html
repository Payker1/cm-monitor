<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="방치형 돈복사">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<title>방치형 돈복사</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Sora:wght@400;600;700;800&display=swap');
  :root{
    --bg:#0b1416;--bg-2:#101d20;--panel:#122225;--panel-2:#173034;
    --line:#22413f;--line-soft:#1b3331;--txt:#f4f6f8;--txt-dim:#a8b0b4;--txt-faint:#6c7679;
    --green:#1fd17a;--green-bg:rgba(31,209,122,.13);--red:#ff4d5e;--red-bg:rgba(255,77,94,.13);
    --amber:#ffb020;--amber-bg:rgba(255,176,32,.13);--blue:#3d8bff;--blue-bg:rgba(61,139,255,.13);
    --purple:#b08aff;--purple-bg:rgba(176,138,255,.14);--accent:#1fd17a;
    --bar-bg:rgba(11,20,22,1);--num:#ffffff;
    --glow1:rgba(31,209,122,0.08);--glow2:rgba(61,139,255,0.05);
  }
  body.light{
    --bg:#f5f6f8;--bg-2:#eceef1;--panel:#ffffff;--panel-2:#f3f4f6;
    --line:#e2e5ea;--line-soft:#eceef1;--txt:#1a1d21;--txt-dim:#5f6671;--txt-faint:#9aa0aa;
    --green:#12925a;--green-bg:rgba(18,146,90,.10);--red:#d12b3a;--red-bg:rgba(209,43,58,.10);
    --amber:#b3760e;--amber-bg:rgba(179,118,14,.12);--blue:#2563c9;--blue-bg:rgba(37,99,201,.10);
    --purple:#7a4fc0;--purple-bg:rgba(122,79,192,.11);--accent:#12925a;
    --bar-bg:rgba(255,255,255,1);--num:#0f1115;
    --glow1:rgba(18,146,90,0.05);--glow2:rgba(37,99,201,0.04);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg)!important;}
  html,body{background:var(--bg);color:var(--txt);font-family:'Sora',sans-serif;overscroll-behavior:none;
    transition:background .35s ease,color .35s ease;}
  body::before{content:'';position:fixed;inset:0;z-index:-1;background:
      radial-gradient(900px 500px at 80% -10%, var(--glow1), transparent 60%),
      radial-gradient(700px 400px at -10% 10%, var(--glow2), transparent 55%),
      var(--bg);}
  body{max-width:480px;margin:0 auto;padding-bottom:83px;min-height:100vh;
    background:radial-gradient(900px 500px at 80% -10%, var(--glow1), transparent 60%),
      radial-gradient(700px 400px at -10% 10%, var(--glow2), transparent 55%),var(--bg);}
  body::after{content:'';position:fixed;top:0;left:50%;transform:translate3d(-50%,0,0);width:100%;max-width:480px;height:env(safe-area-inset-top);background:#0b1416;z-index:60;pointer-events:none;will-change:transform;}
  body.light::after{background:#f5f6f8;}
  .topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
    background:var(--bar-bg);border-bottom:1px solid var(--line);padding:calc(11px + env(safe-area-inset-top)) 16px 10px;}
  .topbar::before{content:'';position:absolute;top:0;left:0;right:0;
    height:env(safe-area-inset-top);background:var(--bg);pointer-events:none;}
  .toprow{display:flex;align-items:center;gap:12px;}
  .themebtn{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
    width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--txt-dim);
    flex:none;transition:all .2s;}
  .themebtn:active{transform:scale(.92);}
  .themebtn svg{width:17px;height:17px;}
  .themebtn .ic-sun{display:block;}
  .themebtn .ic-moon{display:none;}
  body.light .themebtn .ic-sun{display:none;}
  body.light .themebtn .ic-moon{display:block;}
  .brand{font-family:'JetBrains Mono';font-weight:800;font-size:15px;letter-spacing:.5px;}
  .brand b{color:var(--green);}
  .markets{margin-left:auto;display:flex;gap:8px;}
  .mkt{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono';
    font-size:11px;font-weight:700;letter-spacing:.5px;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel-2);}
  .mkt .nm{color:var(--txt-dim);}
  .mkt.bull{border-color:rgba(52,210,127,.4);background:var(--green-bg);}
  .mkt.bull .st{color:var(--green);}
  .mkt.bear{border-color:rgba(255,90,104,.4);background:var(--red-bg);}
  .mkt.bear .st{color:var(--red);}
  .mkt .dot{width:6px;height:6px;border-radius:50%;}
  .mkt.bull .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
  .mkt.bear .dot{background:var(--red);box-shadow:0 0 6px var(--red);}
  .page{display:none;padding:16px 14px 8px;animation:fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-label{font-family:'JetBrains Mono';font-size:10px;font-weight:700;
    letter-spacing:1.5px;color:var(--txt-faint);text-transform:uppercase;margin:4px 2px 10px;}
  .hero{background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;position:relative;overflow:hidden;}
  .hero::after{content:'';position:absolute;inset:0;
    background:radial-gradient(400px 160px at 90% 0%,rgba(31,209,122,.10),transparent 70%);pointer-events:none;}
  .hero .lbl{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-dim);letter-spacing:.5px;}
  .hero .equity{font-family:'JetBrains Mono';font-weight:800;font-size:31px;margin-top:6px;letter-spacing:-1px;}
  .hero .chg{margin-top:6px;font-family:'JetBrains Mono';font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;color:var(--green);}
  .hero .chg .pill{background:var(--green-bg);padding:2px 8px;border-radius:6px;}
  .spark{margin-top:14px;height:46px;width:100%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:13px 14px;}
  .stat .k{font-family:'JetBrains Mono';font-size:10px;color:var(--txt-faint);letter-spacing:.5px;text-transform:uppercase;}
  .stat .v{font-family:'JetBrains Mono';font-weight:800;font-size:21px;margin-top:5px;}
  .stat .sub{font-size:11px;color:var(--txt-dim);margin-top:2px;}
  .pos{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;
    padding:9px 13px;margin-bottom:6px;position:relative;overflow:hidden;cursor:pointer;}
  .pos.danger{border-color:rgba(255,90,104,.45);}
  .pos .accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);}
  .pos.down .accent{background:var(--red);}
  .pos.flat .accent{background:var(--txt-faint);}
  .pos .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .pos .row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px;}
  /* 미장 한글명(name_ko)은 '프리포트 맥모란' 처럼 공백을 포함하는데, JetBrains Mono 는
     고정폭이라 공백이 0.6em(≈8.4px) 로 잡히는 반면 한글 글리프는 폴백 폰트에서 나와
     단어 사이가 과하게 벌어져 보인다. word-spacing 으로 그 공백만 절반으로 줄인다
     (letter-spacing 은 US 심볼 가독성 때문에 그대로 둔다). */
  .pos .t-sym{font-family:'JetBrains Mono';font-weight:800;font-size:14px;letter-spacing:.4px;
    word-spacing:-.3em;}
  .pos .t-r1{font-family:'JetBrains Mono';font-weight:800;font-size:14px;white-space:nowrap;}
  .pos .t-l2{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-dim);}
  .pos .t-r2{font-family:'JetBrains Mono';font-size:11px;font-weight:500;white-space:nowrap;}
  .subnm{font-size:10px;color:var(--txt-faint);font-weight:500;margin-top:1px;}
  .symwrap2{display:flex;flex-direction:column;gap:2px;}
  .symline{display:flex;align-items:center;gap:7px;}
  .pos .exp{max-height:0;opacity:0;overflow:hidden;transition:max-height .28s ease,opacity .2s ease,margin-top .28s ease;}
  .pos.open .exp{max-height:340px;opacity:1;margin-top:8px;}
  .pos .meta{display:flex;gap:13px;flex-wrap:wrap;}
  .pos .m{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-dim);}
  .pos .m b{color:var(--txt);font-weight:600;}
  .stopline{margin-top:8px;background:var(--panel-2);border-radius:9px;padding:7px 11px;
    display:flex;justify-content:space-between;align-items:center;}
  .stopline .sl{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-dim);}
  .stopline .sv{font-family:'JetBrains Mono';font-size:12px;font-weight:700;}
  .sec-label.labelrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .viewseg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;flex:none;}
  .viewseg button{font-family:'JetBrains Mono';font-size:10px;font-weight:700;letter-spacing:0;color:var(--txt-faint);background:none;border:none;border-radius:999px;padding:4px 11px;cursor:pointer;transition:all .16s;text-transform:none;}
  .viewseg button.von{background:var(--green-bg);color:var(--green);}
  /* ── 보유 히트맵 ──
     화면 명칭은 '히트맵' — 증권사 HTS·Finviz 계열에서 이 화면을 그렇게 부른다.
     내부 식별자(tmap/renderTreemap/tmLayout)는 알고리즘 이름인 treemap 을 유지한다.
     data-v='tree' 도 그대로 둔다 — localStorage(cm_posview)에 저장된 기존 선택을 깨지 않기 위함.
     면적=평가금액(크기), 색=당일 등락률(발산형: 빨강←중립→초록), 현금=회색.
     발산 램프는 앱 토큰(--green/--red)을 패널 위에 알파 합성해 만든 값이라 테마와 붙어 있다.
     알파 상한은 '타일 위 흰/검 글자 4.5:1' 을 만족하는 지점에서 끊었다(다크 .54/라이트 .72).
     중립 근처에서 양극이 수렴하는 건 발산형의 정의라, 타일마다 부호 붙은 숫자를 찍어
     색만으로 판단하지 않게 한다(적록색약 시 양극 ΔE 4~6). */
  .tmap{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:var(--panel);}
  .tmap .cell{position:absolute;overflow:hidden;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
    border-radius:6px;padding:2px;cursor:pointer;transition:filter .14s;}
  .tmap .cell:hover,.tmap .cell:focus-visible{filter:brightness(1.14);outline:none;}
  .tmap .cell .s{font-family:'JetBrains Mono';font-weight:800;color:#fff;line-height:1.05;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tmap .cell .d{font-family:'JetBrains Mono';font-weight:700;color:#fff;opacity:.92;line-height:1.05;}
  body.light .tmap .cell .s,body.light .tmap .cell .d{color:#1a1d21;}
  .tmtip{position:absolute;z-index:5;pointer-events:none;background:var(--bar-bg);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:'JetBrains Mono';
    font-size:10.5px;line-height:1.5;color:var(--txt);white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .green{color:var(--green);}.red{color:var(--red);}.amber{color:var(--amber);}.purple{color:var(--purple);}
  .wgroup{margin-bottom:16px;}
  .wghead{display:flex;align-items:center;gap:8px;margin:2px 2px 9px;}
  .wghead .tag{font-family:'JetBrains Mono';font-size:11px;font-weight:700;letter-spacing:.5px;}
  .wghead .cnt{font-family:'JetBrains Mono';font-size:10px;color:var(--txt-faint);
    border:1px solid var(--line);border-radius:6px;padding:1px 7px;}
  .witem{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;
    padding:11px 13px;margin-bottom:8px;display:flex;flex-direction:column;align-items:stretch;}
  .witem .wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .witem.hasch{cursor:pointer;}
  .witem .wexp{max-height:0;opacity:0;overflow:hidden;transition:max-height .28s ease,opacity .2s ease,margin-top .28s ease;}
  .witem.open .wexp{max-height:340px;opacity:1;margin-top:9px;}
  .witem .l{min-width:0;}
  .witem .l .symrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .witem .l .sym{font-family:'JetBrains Mono';font-weight:700;font-size:15px;}
  .rs{font-family:'JetBrains Mono';font-size:9.5px;font-weight:700;letter-spacing:.3px;
    padding:2px 6px;border-radius:5px;border:1px solid;}
  .rs.hi{color:var(--green);border-color:rgba(31,209,122,.4);background:var(--green-bg);}
  .rs.mid{color:var(--amber);border-color:rgba(255,176,32,.4);background:var(--amber-bg);}
  /* 섹터 태그 — RS 배지와 같은 치수, 색은 중립(정보 위계상 RS 보다 낮음) */
  .sect{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:5px;
    color:var(--txt-dim);border:1px solid var(--line);background:transparent;
    white-space:nowrap;}
  .rs.lo{color:var(--txt-faint);border-color:var(--line);background:var(--panel-2);}
  .witem .l .pv{font-family:'JetBrains Mono';font-size:10px;color:var(--txt-faint);margin-top:3px;display:flex;white-space:nowrap;overflow:hidden;}
  .witem .l .pv .pvname{overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1;}
  .witem .l .pv .pvfix{flex-shrink:0;}
  .witem .r{text-align:right;}
  .witem .r .px{font-family:'JetBrains Mono';font-weight:700;font-size:14px;}
  .witem .r .d{font-family:'JetBrains Mono';font-size:11px;margin-top:2px;}
  .chwrap{margin-top:2px;}
  .chsvg{width:100%;height:auto;display:block;background:var(--panel-2);border-radius:8px;}
  .chleg{display:flex;gap:11px;justify-content:center;font-family:'JetBrains Mono';font-size:9px;font-weight:700;margin-top:5px;letter-spacing:.2px;}
  .chload,.cherr{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-faint);text-align:center;padding:20px 8px;}
  .sig{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-soft);}
  .sig .ic{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-family:'JetBrains Mono';font-weight:800;font-size:11px;}
  .ic.buy{background:var(--green-bg);color:var(--green);}
  .ic.sell{background:var(--red-bg);color:var(--red);}
  .ic.stop{background:var(--amber-bg);color:var(--amber);}
  .ic.alert{background:var(--blue-bg);color:var(--blue);}
  .ic.watch{background:var(--purple-bg);color:var(--purple);}
  .sig .body{flex:1;min-width:0;}
  .sig .l1{display:flex;justify-content:space-between;align-items:baseline;}
  .sig .act{font-family:'JetBrains Mono';font-weight:700;font-size:13px;}
  .sig .t{font-family:'JetBrains Mono';font-size:10px;color:var(--txt-faint);}
  .sig .l2{font-size:12px;color:var(--txt-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sig .l2 b{font-family:'JetBrains Mono';color:var(--num);font-weight:700;}
  .sig.hascw{cursor:pointer;}
  .sig .sigexp{max-height:0;opacity:0;overflow:hidden;
    transition:max-height .28s ease,opacity .2s ease,margin-top .28s ease;}
  .sig.wcopen .sigexp{max-height:400px;opacity:1;margin-top:8px;}
  .sig .wcrow{display:flex;align-items:baseline;gap:6px;font-size:12px;padding:3px 0;}
  .sig .wcrow .wcsign{font-family:'JetBrains Mono';font-weight:800;width:12px;flex:none;}
  .sig .wcrow.add .wcsign{color:var(--green);}
  .sig .wcrow.rm .wcsign{color:var(--red);}
  .sig .wcrow .wcnm{font-weight:600;}
  .sig .wcrow .wcreason{color:var(--txt-faint);font-size:11px;}
  /* history */
  .filterrow{margin:2px 0 10px;}
  .seg{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .chip{font-family:'JetBrains Mono';font-size:11px;font-weight:600;padding:6px 12px;
    border-radius:999px;border:1px solid var(--line);background:var(--panel);
    color:var(--txt-dim);cursor:pointer;transition:all .18s;}
  .chip.on{background:var(--green-bg);border-color:rgba(31,209,122,.45);color:var(--green);}
  .summary{background:linear-gradient(160deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .summary .biglbl{font-family:'JetBrains Mono';font-size:11px;color:var(--txt-dim);}
  .summary .big{font-family:'JetBrains Mono';font-weight:800;font-size:26px;letter-spacing:-.5px;margin-top:4px;}
  .summary .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .summary .mini .k{font-family:'JetBrains Mono';font-size:9px;color:var(--txt-faint);letter-spacing:.5px;text-transform:uppercase;}
  .summary .mini .v{font-family:'JetBrains Mono';font-weight:700;font-size:15px;margin-top:3px;}
  .trade{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;
    padding:12px 13px;margin-bottom:8px;position:relative;overflow:hidden;}
  .trade .accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);}
  .trade.loss .accent{background:var(--red);}
  .trade .hd{display:flex;justify-content:space-between;align-items:flex-start;}
  .trade .symwrap{display:flex;align-items:center;gap:7px;}
  .trade .sym{font-family:'JetBrains Mono';font-weight:800;font-size:15px;}
  .trade .flag{font-family:'JetBrains Mono';font-size:9px;font-weight:700;padding:1px 5px;
    border-radius:4px;border:1px solid var(--line);color:var(--txt-faint);}
  .trade .pl{font-family:'JetBrains Mono';font-weight:800;font-size:15px;text-align:right;}
  .trade .plr{font-family:'JetBrains Mono';font-size:11px;margin-top:1px;color:var(--txt-dim);text-align:right;}
  .trade .meta{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
  .trade .m{font-family:'JetBrains Mono';font-size:10.5px;color:var(--txt-dim);}
  .trade .m b{color:var(--txt);font-weight:600;}
  /* market */
  .regcard{border-radius:16px;padding:15px 16px;margin-bottom:11px;border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .1s;}
  .regcard:active{transform:scale(.995);}
  .regcard.sel.bull{box-shadow:0 0 0 2px var(--green);}
  .regcard.sel.bear{box-shadow:0 0 0 2px var(--red);}
  .regcard.sel.side{box-shadow:0 0 0 2px var(--amber);}
  .regcard .pick{font-family:'JetBrains Mono';font-size:9px;font-weight:700;letter-spacing:.5px;
    padding:2px 7px;border-radius:5px;margin-left:8px;display:none;}
  .regcard.bull .pick{background:var(--green);color:#06231a;}
  .regcard.bear .pick{background:var(--red);color:#2a0307;}
  .regcard.side .pick{background:var(--amber);color:#2a1a00;}
  body.light .regcard.bull .pick{color:#ffffff;}
  body.light .regcard.bear .pick{color:#ffffff;}
  .regcard.sel .pick{display:inline-block;}
  .mtitle{display:flex;align-items:center;}
  .regcard.bull{background:linear-gradient(160deg,rgba(31,209,122,.10),var(--panel));border-color:rgba(31,209,122,.35);}
  .regcard.bear{background:linear-gradient(160deg,rgba(255,77,94,.10),var(--panel));border-color:rgba(255,77,94,.35);}

<script>
// 데이터는 Pages 가 빌드하지 않는 data 브랜치에 있고, Cloudflare Worker 를 통해 읽는다.
//   - main(Pages 빌드 브랜치)에 30초마다 커밋하면 push 마다 재빌드가 걸리는데 빌드가
//     38~39초라 34초 간격 push 에 계속 취소된다(실측 성공률 7% → 실제 배포 10분에 1회).
//   - 그렇다고 raw 를 직접 읽으면 max-age=300 + 쿼리스트링을 캐시 키에서 무시해
//     5분 묵은 값이 온다(?t= 캐시버스터가 통하지 않음).
//   - Worker 는 CDN 캐시가 없는 GitHub Contents API 를 대신 호출해 no-store 로 돌려준다.
// FALLBACK: Worker 가 죽거나 토큰이 만료되면 raw 로 자동 강등한다. 신선도는 5분으로
// 떨어지지만 화면이 죽지는 않는다. 표시 시각이 meta.ts 라 묵은 건 눈에 바로 보인다.
const DATA_BASE='https://cm-state.kkl9363.workers.dev';
const DATA_FALLBACK='https://raw.githubusercontent.com/Payker1/cm-monitor/data';
const STATE_URL=DATA_BASE+'/state.json', REFRESH_MS=15000;

// ⚠ 여기에 Cache-Control/Pragma 헤더를 넣지 말 것. 두 헤더는 CORS 안전목록이 아니라
// 교차 출처 요청에서 OPTIONS 프리플라이트를 유발하는데, raw.githubusercontent.com 은
// 프리플라이트에 응답하지 않아 fetch 가 통째로 실패한다(동일 출처였을 땐 무해했음).
// 캐시 무력화는 ?t= 쿼리와 cache:'no-store' 로 충분하다.
async function fetchData(path){
  let err=null;
  for(const base of [DATA_BASE, DATA_FALLBACK]){
    try{
      const r=await fetch(base+path+'?t='+Date.now(),{cache:'no-store'});
      if(r.ok) return r;
      err=new Error('HTTP '+r.status+' @ '+base);
    }catch(e){ err=e; }
  }
  throw err||new Error('no data source');
}
let STATE=null, curM='all', curP='1m', curMarket='kr', sheetKey='vol', userPicked=false, posF='all', watF='all', sigF='all', lastFetch=null, watchPicked=false;
let posView=localStorage.getItem('cm_posview')||'eval';
if(posView==='tree') posView='eval';   // 보유탭 히트맵 제거 — 이전 세션에 저장된 값 호환
const posOpen=new Set();
const watchOpen=new Set();
const sigOpen=new Set();   // '스크리닝 완료' 시그널 중 탭해서 펼친 것(ts 로 식별)

// ── 탭 네비 ──
const btns=document.querySelectorAll('.nav button'), pages=document.querySelectorAll('.page');
btns.forEach(b=>b.addEventListener('click',()=>{
  btns.forEach(x=>x.classList.remove('active'));
  pages.forEach(p=>p.classList.remove('active'));
  b.classList.add('active');
  document.getElementById(b.dataset.t).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  // 섹터 히트맵은 글자 크기를 실제 렌더 픽셀로 재서 정한다(tmFit). 마켓 탭이
  // display:none 인 동안 데이터가 갱신돼 그때 그려졌다면 폭/높이가 0으로 측정돼
  // 라벨이 전부 숨김 처리된 채 남는다 — 탭이 실제로 보이는 지금 다시 맞춘다.
  if(b.dataset.t==='market'){ const box=document.getElementById('tmap'); if(box) tmFit(box); }
}));

// ── 테마 토글 ──
document.getElementById('themeToggle').addEventListener('click',()=>{
  document.body.classList.toggle('light');
  const dark=!document.body.classList.contains('light');
  document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#0b1416':'#f5f6f8');
  localStorage.setItem('cm_theme',dark?'dark':'light');
  // 히트맵 색은 테마별 램프에서 뽑아 인라인 style 로 박히므로 클래스 토글만으론 안 바뀐다.

});

function spark(series){
  if(!series||series.length<2) return '';
  const w=320,h=46,mn=Math.min(...series),mx=Math.max(...series),rng=(mx-mn)||1;
  const pts=series.map((v,i)=>((i/(series.length-1))*w).toFixed(0)+','+(h-4-((v-mn)/rng)*(h-8)).toFixed(1));
  const line='M'+pts.join(' L');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(31,209,122,.35)"/><stop offset="100%" stop-color="rgba(31,209,122,0)"/></linearGradient></defs>
    <path d="${line}" fill="none" stroke="var(--green)" stroke-width="2"/><path d="${line} L${w},${h} L0,${h} Z" fill="url(#g)"/></svg>`;
}

const SIG_META={buy:['buy','BUY','green','매수 체결'],pyramid:['buy','ADD','green','추가 매수'],sell:['sell','SEL','red','매도 체결'],add:['watch','ADD','purple','관심종목 추가'],bo:['watch','BO','blue','피벗 돌파'],chase_drop:['stop','OUT','amber','추격 이탈'],stop:['stop','STP','amber','손절선 조정'],alert:['alert','ALT','blue','시장 국면']};
function sigRow(s){

  // 탭하면 펼쳐 보여준다(watchlist_changes — 피벗 7% 이탈로 장중 제거된 것도 포함).
  if(s.type==='alert'){

      <div class="l1"><span class="act blue">${esc(s.market||'')}${s.market?' · ':''}시장 국면${s.regime?` · ${esc(s.regime)}`:''}</span><span class="t">${t}</span></div>
      <div class="l2">${esc(s.note||'')}</div>${wcBody}</div></div>`;

    ]);

  }
  return `<div class="sig"><div class="ic ${m[0]}">${m[1]}</div><div class="body">
    <div class="l1"><span class="act ${m[2]}">${m[3]} · ${nm}</span><span class="t">${t}</span></div>

// ── 종목 차트 (일봉 3개월 + 이평선 5종) ──
const chartCache=new Map();
function buildChartSVG(data,opts){
  opts=opts||{};
  const bars=(data&&data.bars)||[], mkt=(data&&data.market)||'US';
  if(bars.length<2) return '<div class="cherr">차트 데이터 부족</div>';
  const W=324,H=150,padL=3,padR=3,padT=8,padB=4, plotW=W-padL-padR, plotH=H-padT-padB, n=bars.length;
  let mn=Infinity,mx=-Infinity; const con=v=>{if(v!=null&&isFinite(v)){if(v<mn)mn=v;if(v>mx)mx=v;}};
  let hi=-Infinity;
  bars.forEach(b=>{con(b.h);con(b.l);con(b.ma10);con(b.ma20);con(b.ma50);con(b.ma150);con(b.ma200); if(b.h!=null&&b.h>hi)hi=b.h;});
  const avg=(opts.avg!=null&&isFinite(opts.avg))?opts.avg:null; if(avg!=null)con(avg);
  if(!isFinite(mn)||!isFinite(mx)||mx<=mn){mx=mn+1;}
  const pd=(mx-mn)*0.04; mn-=pd; mx+=pd;
  const X=i=>padL+(n===1?0:i/(n-1))*plotW, Y=v=>padT+(mx-v)/(mx-mn)*plotH;
  const bw=Math.max(1.1,plotW/n*0.55);
  let bs='';
  bars.forEach((b,i)=>{const x=X(i),up=(b.c>=b.o),col=up?'var(--green)':'var(--red)';
    bs+=`<line x1="${x.toFixed(1)}" y1="${Y(b.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(b.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
      +`<line x1="${(x-bw/2).toFixed(1)}" y1="${Y(b.o).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(b.o).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
      +`<line x1="${x.toFixed(1)}" y1="${Y(b.c).toFixed(1)}" x2="${(x+bw/2).toFixed(1)}" y2="${Y(b.c).toFixed(1)}" stroke="${col}" stroke-width="1"/>`;});
  const ma=(k,color,w)=>{const pts=bars.map((b,i)=>(b[k]!=null&&isFinite(b[k]))?`${X(i).toFixed(1)},${Y(b[k]).toFixed(1)}`:null).filter(Boolean);
    return pts.length>=2?`<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" opacity="0.92"/>`:'';};
  const mas=ma('ma10','var(--txt-faint)',1)+ma('ma20','var(--txt)',1)+ma('ma50','var(--red)',1.2)+ma('ma150','var(--amber)',1.2)+ma('ma200','var(--green)',1.4);
  const marker=(val,color,label)=>{ if(val==null||!isFinite(val))return ''; const y=Y(val), ly=Math.min(Math.max(y-2,9),H-3);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="0.8" stroke-dasharray="3 2.5" opacity="0.85"/>`
      +`<text x="${W-padR-1}" y="${ly.toFixed(1)}" text-anchor="end" font-size="8" font-family="'JetBrains Mono',monospace" font-weight="700" fill="${color}">${label}</text>`;};
  const mk=(isFinite(hi)?marker(hi,'var(--txt-dim)','최고 '+px(hi,mkt)):'')+(avg!=null?marker(avg,'var(--blue)','평단 '+px(avg,mkt)):'');
  const leg=`<div class="chleg"><span style="color:var(--txt-faint)">━10</span><span style="color:var(--txt)">━20</span><span style="color:var(--red)">━50</span><span style="color:var(--amber)">━150</span><span style="color:var(--green)">━200</span></div>`;
  return `<div class="chwrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="chsvg">${bs}${mas}${mk}</svg>${leg}</div>`;
}
async function loadChart(market,sym,mount,opts){
  if(!mount||!market||!sym) return; opts=opts||{};
  const key=`${market}_${sym}`, cached=chartCache.get(key);
  if(cached&&cached.status==='done'){ mount.innerHTML=buildChartSVG(cached.data,opts); return; }
  if(cached&&cached.status==='err'){ mount.innerHTML='<div class="cherr">차트 데이터 없음</div>'; return; }
  if(cached&&cached.status==='loading'){ return; }
  chartCache.set(key,{status:'loading'});
  mount.innerHTML='<div class="chload">차트 불러오는 중…</div>';
  try{
    const r=await fetchData('/charts/'+key+'.json');
    if(!r.ok) throw new Error('http '+r.status);
    const data=await r.json();
    chartCache.set(key,{status:'done',data}); mount.innerHTML=buildChartSVG(data,opts);
  }catch(e){ chartCache.set(key,{status:'err'}); mount.innerHTML='<div class="cherr">차트 데이터 없음</div>'; }
}
function mountChart(m){ if(!m)return; const avg=(m.dataset.avg!=null&&m.dataset.avg!=='')?parseFloat(m.dataset.avg):null; loadChart(m.dataset.mk,m.dataset.sym,m,{avg}); }

// ── 섹터 히트맵(구현은 squarified treemap) ──────────────────────
// 면적=순위가중 점수(1등에 가장 큰 가산점), 색=섹터 평균 당일 등락률(발산형,
// 초록/빨강) — 방향성 있는 지표로 바꿔달라는 요청. 평균도 순위가중을 그대로
// 써서(크기를 정하는 가중치와 동일) 상위권 종목의 오늘 움직임이 더 크게 반영된다.
// 등락률을 아직 못 받아온 섹터(부팅 직후 몇 틱)는 방향을 지어내지 않고 중립색.
// 색 단계는 보유 히트맵에 쓰던 것과 같은 합성식(앱 --green/--red 토큰을 패널 위에
// 알파 합성, 다크 .16/.287/.413/.54, 라이트 .24/.4/.56/.72) — 상한은 타일 위 글자
// 대비 4.5:1 을 만족하는 지점이다.
const TM_GREEN={dark:['#143e33','#16543d','#176a48','#198153'],
                light:['#c6e5d7','#a0d3bd','#7ac2a3','#54b188']};
const TM_RED  ={dark:['#38292e','#562e35','#74343d','#923944'],
                light:['#f4ccd0','#edaab0','#e58891','#de6671']};
const TM_NEUTRAL={dark:'#243336', light:'#ebecee'};
// 등락률 → 단계. 임계는 하루 변동 체감에 맞춘 0.5 / 1.5 / 3.0%.
const tmStep=v=>{const a=Math.abs(v); return a<0.5?0:a<1.5?1:a<3?2:3;};
function tmColor(chg){
  const mode=document.body.classList.contains('light')?'light':'dark';
  if(chg==null) return TM_NEUTRAL[mode];
  return (chg>=0?TM_GREEN:TM_RED)[mode][tmStep(chg)];
}
// squarified treemap — 타일이 정사각형에 가깝게 배치되도록 행 단위로 나눈다.
// 타일 목표 가로세로비 — 각 타일이 이 비율에 가깝게 나오도록 행을 끊는다.
// 표준 squarified 는 1:1(정사각형)을 목표로 하는데, 그러면 종목 수가 적을 때
// 얇은 막대가 나온다(관측: 보유 1종목일 때 FCX 가 세로 막대).
const TM_ASPECT=4/3;
// 목표비 대비 이탈 배수(1 이면 정확히 목표비)
const tmDev=(w,h)=>{ if(w<=0||h<=0) return Infinity; const a=w/h;
  return Math.max(a/TM_ASPECT, TM_ASPECT/a); };
// 한 단계 분할. forceH 가 주어지면 그 방향으로, 아니면 표준 규칙(짧은 변)을 따른다.
//   horiz=true  : 폭 thick 의 세로 띠 — 타일이 위아래로 쌓인다
//   horiz=false : 높이 thick 의 가로 띠 — 타일이 좌우로 놓인다
function tmSplit(items,x,y,w,h,out,forceH){
  if(!items.length) return out;
  if(items.length===1){ out.push({...items[0],x,y,w,h}); return out; }
  const total=items.reduce((s,i)=>s+i.v,0);
  const horiz=(forceH===undefined)?(w>=h):forceH;
  const side=horiz?h:w, span=horiz?w:h;
  // 행에 담긴 타일들의 최악 이탈. 실제 폭·높이를 만들어 재므로 목표비가 1 이 아니어도
  // 된다(표준 squarified 공식은 1:1 전용이라 4:3 을 표현할 수 없다).
  const worst=(row)=>{
    const S=row.reduce((s,i)=>s+i.v,0);
    if(!S) return Infinity;
    const t=(S/total)*span;
    let bad=1;
    for(const it of row){
      const l=side*(it.v/S);
      bad=Math.max(bad, tmDev(horiz?t:l, horiz?l:t));
    }
    return bad;
  };
  let row=[], rest=[...items];
  while(rest.length){
    const cand=[...row,rest[0]];
    if(!row.length || worst(cand)<=worst(row)){ row=cand; rest.shift(); }
    else break;
  }
  const S=row.reduce((s,i)=>s+i.v,0), thick=(S/total)*span;
  let off=0;
  row.forEach(i=>{ const l=side*(i.v/S);
    if(horiz) out.push({...i,x,y:y+off,w:thick,h:l});
    else      out.push({...i,x:x+off,y,w:l,h:thick});
    off+=l; });
  const rr=items.slice(row.length);
  if(rr.length) horiz?tmSplit(rr,x+thick,y,w-thick,h,out):tmSplit(rr,x,y+thick,w,h-thick,out);
  return out;
}
function tmLayout(items,x,y,w,h,out){
  // 최상위 분할만 두 방향을 다 재보고 고른다. 매 단계에서 고르면 그 단계는 좋아져도
  // 남는 영역이 나빠져 전체가 악화된다(실측: 5종목 최악 ×1.9 → ×6.7).
  // 안쪽은 표준 규칙(짧은 변)을 쓴다 — 전역적으로 가장 안정적이다.
  if(items.length<2) return tmSplit(items,x,y,w,h,out);
  const score=(cells)=>{
    let bad=1, worstCell=null;
    for(const c of cells){ const d=tmDev(c.w,c.h); if(d>bad){ bad=d; worstCell=c; } }
    return {bad, wide: worstCell? worstCell.w>=worstCell.h : true};
  };
  const A=tmSplit(items,x,y,w,h,[],true),  sa=score(A);
  const B=tmSplit(items,x,y,w,h,[],false), sb=score(B);
  // 이탈이 같으면 '최악 타일이 가로로 눕는' 쪽 — 라벨이 가로쓰기라 그쪽이 읽힌다.
  const pick=(sb.bad<sa.bad-1e-9)?B:(sa.bad<sb.bad-1e-9)?A:(sa.wide?A:B);
  pick.forEach(c=>out.push(c));
  return out;
}
// RS 상위 50 리스트 → 섹터별 순위가중 점수. 1등이 가장 큰 가산점(N점), 꼴찌가 1점 —
// 단순 개수가 아니라 "몇 등짜리가 몇 개 있는가"로 지금 주도 섹터를 가린다.
// 섹터 없는 종목(태그 미확정)은 제외 — 없는 걸 '기타'로 뭉개지 않는다는 원칙과 동일.
function sectorHeatItems(rows){
  const n=rows.length, by={};
  rows.forEach((r,i)=>{
    if(!r.sector) return;
    const w=n-i;   // 1등=n점 ... 꼴찌=1점 — 크기와 등락률 가중 둘 다 이 값을 쓴다.
    const g=by[r.sector]||(by[r.sector]={sector:r.sector,v:0,count:0,top:r.name||r.sym,cw:0,csum:0});
    g.v+=w; g.count+=1;
    // 등락률이 아직 안 채워진 종목(부팅 직후 몇 틱)은 평균에서 제외 — 0으로 넣으면
    // '오늘 안 움직였다'는 거짓 신호가 된다. 그런 종목만 있으면 섹터 색은 중립.
    if(r.change_pct!=null){ g.cw+=w; g.csum+=w*r.change_pct; }
  });
  return Object.values(by).map(g=>({...g, chg: g.cw?g.csum/g.cw:null}))
                           .sort((a,b)=>b.v-a.v);
}
function renderSectorHeatmap(rows){
  const items=sectorHeatItems(rows);
  if(!items.length) return emptyMsg('섹터 데이터 없음');
  const W=1000,H=750;
  const cells=tmLayout(items,0,0,W,H,[]);
  const tot=items.reduce((s,i)=>s+i.v,0);
  const body=cells.map(c=>{
    const pct=tot?c.v/tot*100:0;
    const dtxt=c.chg==null?'—':signPct(c.chg);
    // 글자 크기는 렌더 뒤 실제 픽셀을 재서 정한다(tmFit) — 컨테이너 폭이 기기마다 달라
    // 가상 좌표만으로는 맞출 수 없다.
    return `<div class="cell" tabindex="0" style="left:${(c.x/W*100).toFixed(3)}%;top:${(c.y/H*100).toFixed(3)}%;`
      +`width:calc(${(c.w/W*100).toFixed(3)}% - 2px);height:calc(${(c.h/H*100).toFixed(3)}% - 2px);`
      +`margin:1px;background:${tmColor(c.chg)}" `
      +`data-l="${esc(c.sector)}" data-p="${pct.toFixed(1)}" data-n="${c.count}" data-top="${esc(c.top)}" `
      +`data-c="${c.chg==null?'':c.chg}">`
      +`<span class="s">${esc(c.sector)}</span><span class="d">${dtxt}</span></div>`;
  }).join('');
  return `<div class="tmap" id="tmap">${body}</div>`;
}
// 타일 실제 픽셀 크기에 맞춰 글자 크기를 정한다.
// 높이뿐 아니라 '라벨 길이 대비 폭'도 함께 봐야 긴 이름(예: 하나금융지주)이 잘리지 않는다.
function tmFit(box){
  box.querySelectorAll('.cell').forEach(el=>{
    const w=el.clientWidth, h=el.clientHeight;
    const nameEl=el.querySelector('.s'), pctEl=el.querySelector('.d');
    const len=Math.max(1,(nameEl?nameEl.textContent:'').length);
    const wide=/[\u3131-\uD79D]/.test(nameEl?nameEl.textContent:'');
    const perCh=wide?1.02:0.62;
    let fs=Math.min(h*0.34, (w-6)/(len*perCh));
    fs=Math.max(7,Math.min(17,fs));
    let ds=Math.min(h*0.24,(w-6)/5.4);
    ds=Math.max(6.5,Math.min(13,ds));
    if(nameEl){ nameEl.style.fontSize=fs.toFixed(1)+'px';
                nameEl.style.display=(h<13||w<20)?'none':''; }
    if(pctEl){  pctEl.style.fontSize=ds.toFixed(1)+'px';
                pctEl.style.display=(h<30||w<28)?'none':''; }
  });
}
// 타일 hover/focus 시 상세 — 종목수·대표종목은 면적만으로는 안 보인다.
function hydrateTreemap(){
  const box=document.getElementById('tmap'); if(!box) return;
  tmFit(box);
  // 회전·창 크기 변화 시 다시 맞춘다(타일은 %로 잡혀 있어 글자만 재계산하면 된다).
  clearTimeout(window.__tmFitT);
  if(!window.__tmFitBound){ window.__tmFitBound=true;
    window.addEventListener('resize',()=>{ clearTimeout(window.__tmFitT);
      window.__tmFitT=setTimeout(()=>{ const b=document.getElementById('tmap'); if(b) tmFit(b); },120); }); }
  // tip 상태를 전역(window)에 둔다 — hydrateTreemap 은 탭 전환·새로고침마다
  // 다시 호출되는데, 함수 지역 변수로 두면 그때마다 새 클로저가 생겨 아래
  // "바깥 탭 시 닫기" 전역 핸들러가 예전 tip 을 못 찾는다.
  const hide=()=>{ if(window.__tmTip){window.__tmTip.remove(); window.__tmTip=null; window.__tmTipFor=null;} };
  const show=(el)=>{
    if(window.__tmTipFor===el){ hide(); return; }   // 같은 타일 다시 탭 → 닫기
    hide();
    const c=el.dataset.c===''?null:+el.dataset.c;
    const tip=document.createElement('div'); tip.className='tmtip';
    tip.innerHTML=`<b>${esc(el.dataset.l)}</b><br>비중 ${el.dataset.p}% · ${el.dataset.n}종목`
      +(c==null?'':`<br>평균 ${signPct(c)}`)+`<br>대표 ${esc(el.dataset.top)}`;
    box.appendChild(tip);
    const br=box.getBoundingClientRect(), er=el.getBoundingClientRect(), tr=tip.getBoundingClientRect();
    let L=er.left-br.left+er.width/2-tr.width/2, T=er.top-br.top-tr.height-6;
    if(T<2) T=er.top-br.top+er.height+6;
    tip.style.left=Math.max(2,Math.min(L,br.width-tr.width-2))+'px'; tip.style.top=T+'px';
    window.__tmTip=tip; window.__tmTipFor=el;
  };
  box.querySelectorAll('.cell').forEach(el=>{
    el.addEventListener('mouseenter',()=>show(el));
    el.addEventListener('focus',()=>show(el));
    el.addEventListener('mouseleave',hide);
    el.addEventListener('blur',hide);
    el.addEventListener('click',()=>show(el));   // 터치 기기
  });
  box.addEventListener('mouseleave',hide);
  // 타일이 아닌 다른 곳(화면 어디든)을 탭하면 닫는다 — 한 번만 등록.
  if(!window.__tmOutsideBound){ window.__tmOutsideBound=true;
    document.addEventListener('click',(e)=>{
      if(!e.target.closest('.tmap .cell')) hide();
    });
  }
}

// 선택된 기간(curP)의 시작 시각(ms). all 이면 0(전체 통과).
function histCutoff(){
  const now=new Date();
  if(curP==='1m'){ const d=new Date(now); d.setMonth(d.getMonth()-1); return d.getTime(); }
  if(curP==='3m'){ const d=new Date(now); d.setMonth(d.getMonth()-3); return d.getTime(); }
  if(curP==='ytd'){ return new Date(now.getFullYear(),0,1).getTime(); }
  return 0; // all
}
// 시장(curM)+기간(curP)으로 청산 거래를 필터. 청산일(exit_date) 기준.
function histTrades(){
  let ts=((STATE.history||{}).trades)||[];
  if(curM!=='all') ts=ts.filter(t=>(t.market||'').toLowerCase()===curM);
  const cutoff=histCutoff();
  if(cutoff>0) ts=ts.filter(t=>{ const x=t.exit_date?Date.parse(t.exit_date):0; return x&&x>=cutoff; });
  return ts;
}
function applyHist(){
  // 서버 집계(agg) 대신 필터된 거래에서 직접 재계산 → 기간 선택이 정확히 반영됨.
  const ts=histTrades();
  let plSum=0, wins=0, gain=0, loss=0, lossN=0;
  for(const t of ts){
    const v=+t.pl_krw||0; plSum+=v;
    const isLoss=t.is_loss||(+t.pl_pct||0)<0;
    if(isLoss){ lossN++; loss+=Math.abs(+t.pl_pct||0); } else { wins++; gain+=Math.abs(+t.pl_pct||0); }
  }
  const n=ts.length;
  const winRate=n?Math.round(wins/n*100):0;
  // 손익비: 평균이익% / 평균손실% (손실 없으면 이익 종목만일 때 대비 안전 처리)
  const avgWin=wins?gain/wins:0, avgLoss=lossN?loss/lossN:0;
  const rr=avgLoss>0?(avgWin/avgLoss):(avgWin>0?avgWin:0);
  const pl=document.getElementById('sumPL'); pl.textContent=signWon(plSum); pl.className='big '+cls(plSum);
  document.getElementById('sumWin').textContent=winRate+'%';
  document.getElementById('sumRR').textContent=rr.toFixed(1);
  document.getElementById('sumN').textContent=n+'건';
  document.getElementById('sumScope').textContent='· '+({all:'전체',kr:'KR',us:'US'}[curM])+' · '+({'1m':'1개월','3m':'3개월',ytd:'YTD',all:'전체'}[curP]);
}
function renderTrades(){

    const loss=t.is_loss||(t.pl_pct||0)<0, c=loss?'red':'green';
    return `<div class="trade ${loss?'loss':''}"><div class="accent"></div>
      <div class="hd"><div class="symwrap2"><div class="symline"><span class="sym">${mainNm(t)}</span><span class="flag">${esc(t.market)}</span></div>${subNm(t)?`<span class="subnm">${subNm(t)}</span>`:''}</div>
        <div><div class="pl ${c}">${signPct(t.pl_pct)}</div><div class="plr ${c}">${maskSignWon(t.pl_krw)} · ${(t.rr>=0?'+':'')}${(t.rr||0).toFixed(1)}R</div></div></div>
      <div class="meta"><span class="m">진입 <b>${px(t.entry,t.market)}</b></span><span class="m">청산 <b>${px(t.exit,t.market)}</b></span><span class="m">보유 <b>${t.hold_days||0}일</b></span><span class="m">${(t.exit_date||'').slice(5).replace('-','/')}</span></div></div>`;
  }).join(''):emptyMsg('해당 기간 매매 없음');
}

function regCard(id,flag,name,d){
  const mkt=id==='cardKR'?'kr':'us';
  if(!d) return `<div class="regcard" id="${id}" data-mkt="${mkt}"><div class="top"><span class="mname">${flag} ${name}</span></div><div class="rows"><div class="regrow"><span class="lbl">데이터 없음</span></div></div></div>`;
  const rg=d.regime, bull=rg==='강세', side=rg==='횡보', dd=Math.max(0,Math.min(6,d.dd_count||0));
  const ddbar=Array.from({length:6},(_,i)=>`<i class="${i<dd?'hit':''}"></i>`).join('');
  const idx=d.idx_vs_50ma_pct||0, idxUp=idx>=0, mc=bull?'green':(side?'amber':'red'), cardCls=bull?'bull':(side?'side':'bear');
  return `<div class="regcard ${cardCls}" id="${id}" data-mkt="${mkt}">
    <div class="top"><span class="mtitle"><span class="mname">${flag} ${name}</span><span class="pick">선택됨</span></span><span class="verdict">${bull?'강세 · 공격':(side?'횡보 · 주의':'약세 · 방어')}</span></div>
    <div class="rows">
      <div class="regrow"><span class="lbl">분산일 (DD, 25일)</span><span class="ddbar">${ddbar}</span></div>
      <div class="regrow"><span class="lbl">마지막 추격일 (FTD)</span><span class="val ${mc}">${d.ftd?(d.ftd.slice(5).replace('-','/')+' 확인'):'미발생 · 대기'}</span></div>
      <div class="regrow"><span class="lbl">지수 vs 50일선</span><span class="val ${mc}">${signPct(idx)} ${idxUp?'위 ▲':'아래 ▼'}</span></div>
    </div></div>`;
}

function renderMarket(mkt){
  curMarket=mkt;

  document.getElementById('mktLabelLead').textContent=mkt==='kr'?'국장':'미장';

  document.getElementById('leadList').innerHTML=leaders.length?leaders.map(l=>{
    const main=isKR?esc(l.name||l.sym):esc(l.sym), sub=isKR?esc(l.sym):esc(l.name||'');
    return `<div class="lead"><div class="l"><div class="sym"><span>${main}${ownBadge(l.sym)}</span><span class="rs ${rsCls(l.rs)}">RS ${l.rs}</span>${sectTag(l.sector)}</div><div class="sub" title="${sub}">${sub}</div></div>
     <div class="r"><div class="vol">${fmtTV(l.value,mkt)}</div><div class="vollbl">거래대금</div></div></div>`;
  }).join(''):emptyMsg('데이터 없음');

  if(document.getElementById('rankSheet').classList.contains('open')) renderRank();
}
function autoMarket(){const now=new Date(),k=(now.getUTCHours()*60+now.getUTCMinutes()+540)%1440;return (k>=330&&k<930)?'kr':'us';}

let lastSigTs=localStorage.getItem('cm_lastsig')||'';
function checkNewSignals(){
  const sigs=(STATE&&STATE.signals_recent)||[];
  if(!sigs.length) return;
  const newest=sigs[0].ts||'';
  if(lastSigTs && newest>lastSigTs && ('Notification' in window) && Notification.permission==='granted' && ['buy','sell','pyramid'].includes(sigs[0].type)){
    const s=sigs[0], label=(SIG_META[s.type]||[,,,s.type])[3];
    try{ new Notification(`${label} · ${s.market==='KR'?(s.name||s.sym):s.sym}`,{tag:newest}); }catch(e){}
  }
  if(newest){ lastSigTs=newest; localStorage.setItem('cm_lastsig',newest); }
}
